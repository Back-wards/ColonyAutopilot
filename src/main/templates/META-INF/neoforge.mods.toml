modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"

credits="Made by Backwards"

authors="Backwards"

description='''
Place a Town Hall and the colony runs itself.
It places, builds and upgrades its huts, lays roads and levels its plots.
It supplies, staffs, researches, repairs and defends itself.
In Progression Mode, on by default, it pays its way in ColonyBucks.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecolonies"
    type="required"
    versionRange="${minecolonies_version_range}"
    ordering="AFTER"
    side="BOTH"
